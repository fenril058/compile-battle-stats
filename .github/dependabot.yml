# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configurationoptions-for-the-dependab-ot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"

      testing:
        dependency-type: "development"
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
          - "@testing-library/*"
          - "@firebase/rules-unit-testing"
          - "happy-dom"
          - "vitest*"
          - "@vitest/*"

      build-tools:
        dependency-type: "development"
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"

      type-tools:
        dependency-type: "development"
        patterns:
          - "typescript"
          - "@types/*"
          - "globals"

      vercel:
        patterns:
          - "@vercel/*"

      repo-tools:
        dependency-type: "development"
        patterns:
          - "husky"
          - "lint-staged"
          - "secretlint"
          - "@secretlint/*"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3

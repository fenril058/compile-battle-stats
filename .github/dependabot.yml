# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configurationoptions-for-the-dependab-ot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 2
    groups:
      npm-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # @playwright/test は nixpkgs の playwright-driver と同じバージョンでなければ
    # E2E がブラウザを見つけられない (docs/testing.md, scripts/check-playwright-version.mjs)。
    # nixpkgs が先に動かない限り上げても必ず壊れるので、バージョンは nixpkgs に追随して
    # 手で上げる。追随の合図は nixpkgs bump PR で playwright-nix.yml が赤くなることで受け取る。
    ignore:
      - dependency-name: "@playwright/test"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 3
